<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <title>Projektdaten</title>
</head>
<body>
  <div class="wrap" id="app"></div>

<script src="./config.js"></script>
<script>
  var t = TrelloPowerUp.iframe();
  function resize(){ if(t && t.sizeTo){ requestAnimationFrame(function(){ t.sizeTo('#app'); }); } }
  var config = null, data = {}, dirty = false, statusEl = null, saveBtn = null;

  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
  function markDirty(){ dirty=true; if(statusEl){ statusEl.textContent='● Nicht gespeichert'; statusEl.className='status dirty'; } if(saveBtn) saveBtn.disabled=false; }

  function makeInput(key, type){
    var i = document.createElement(type==='textarea' ? 'textarea' : 'input');
    if(type && type!=='textarea') i.type=type; else if(!type) i.type='text';
    if(type==='textarea') i.rows=4;
    i.value = data[key] || '';
    i.addEventListener('input', function(){ data[key]=i.value; markDirty(); });
    return i;
  }
  function makeSelect(key, options){
    var s = document.createElement('select');
    s.appendChild(new Option('— bitte wählen —',''));
    (options||[]).forEach(function(o){ s.appendChild(new Option(o,o)); });
    if(data[key] && (options||[]).indexOf(data[key])>-1) s.value=data[key];
    s.addEventListener('change', function(){ data[key]=s.value; markDirty(); });
    return s;
  }
  function makeNumber(key){
    var i=document.createElement('input'); i.type='number'; i.min='0'; i.inputMode='numeric'; i.placeholder='0';
    i.value = data[key]!=null ? data[key] : '';
    i.addEventListener('input', function(){ data[key]=i.value; markDirty(); });
    return i;
  }
  function fieldWrap(labelText, inputEl){ var f=el('div','field'); f.appendChild(el('label',null,labelText)); f.appendChild(inputEl); return f; }

  function collapseRow(headingText, targetBuilder){
    var row=el('div','section-heading-row');
    row.appendChild(el('h2','section-heading',headingText));
    var btn=el('button','collapse-btn collapsed','▾'); btn.title='Ein-/ausklappen'; row.appendChild(btn);
    var body=el('div','collapsible collapsed');
    targetBuilder(body);
    btn.addEventListener('click', function(){ var c=body.classList.toggle('collapsed'); btn.classList.toggle('collapsed',c); resize(); });
    return [row, body];
  }

  function render(){
    var app=document.getElementById('app'); app.innerHTML='';

    // Kopf mit Master-Collapse
    var head=el('div','head');
    head.appendChild(el('span','icon','▤'));
    head.appendChild(el('span','title', config.headings.projekt || 'Projektdaten'));
    var masterBtn=el('button','collapse-btn','▾'); masterBtn.title='Alles ein-/ausklappen'; head.appendChild(masterBtn);
    app.appendChild(head);

    var content=el('div','body');
    masterBtn.addEventListener('click', function(){ var c=content.classList.toggle('collapsed'); masterBtn.classList.toggle('collapsed',c); resize(); });

    // ---- Personalien ----
    var pers=collapseRow(config.headings.personalien || 'Personalien', function(body){
      var box=el('div','plan-group g-'+(config.personalien.color||'gray'));
      var rowsHtml = PERSONALIEN_FIELDS;
      for(var i=0;i<rowsHtml.length;i+=2){
        var a=rowsHtml[i], b=rowsHtml[i+1];
        var cls='grid2';
        if(a.width==='w75' && b && b.width==='w25') cls='grid2 grid-3-1';
        if(a.width==='w25' && b && b.width==='w75') cls='grid2 grid-1-3';
        var g=el('div',cls);
        g.appendChild(buildPersField(a));
        if(b) g.appendChild(buildPersField(b));
        box.appendChild(g);
      }
      body.appendChild(box);
    });
    content.appendChild(pers[0]); content.appendChild(pers[1]);

    // ---- Eckdaten ----
    var eck=collapseRow(config.headings.eckdaten || 'Eckdaten', function(body){
      var box=el('div','plan-group g-'+((config.eckdaten && config.eckdaten.color) || 'teal'));
      var i=0;
      while(i<ECKDATEN_FIELDS.length){
        var w=ECKDATEN_FIELDS[i].width;
        var cap = w===25?4 : w===33?3 : w===50?2 : 1;
        var g=el('div','grid-eck eck-'+w);
        var n=0;
        while(i<ECKDATEN_FIELDS.length && ECKDATEN_FIELDS[i].width===w && n<cap){
          var f=ECKDATEN_FIELDS[i];
          g.appendChild(fieldWrap(f.label, makeInput(f.key,'text')));
          i++; n++;
        }
        box.appendChild(g);
      }
      body.appendChild(box);
    });
    content.appendChild(eck[0]); content.appendChild(eck[1]);

    // ---- Planung ----
    var plan=collapseRow(config.headings.planung || 'Planung', function(body){
      config.groups.forEach(function(grp){
        var box=el('div','plan-group g-'+(grp.color||'gray'));
        box.appendChild(el('h3','subheading', grp.title));
        grp.rows.forEach(function(r){
          var g=el('div','grid2 grid-plan');
          g.appendChild(fieldWrap(r.label, makeSelect(r.key, r.options)));
          g.appendChild(fieldWrap(r.countLabel, makeNumber(r.key+'_anzahl')));
          box.appendChild(g);
        });
        body.appendChild(box);
      });
    });
    content.appendChild(plan[0]); content.appendChild(plan[1]);

    // ---- Zusatzfelder (nicht im CSV) ----
    var extra=el('div','extra-box');
    EXTRA_FIELDS.forEach(function(f){
      extra.appendChild(fieldWrap(f.label, makeInput(f.key, f.type)));
    });
    content.appendChild(extra);

    app.appendChild(content);

    // ---- Speicherleiste ----
    var bar=el('div','savebar');
    saveBtn=el('button','btn btn-primary','💾 Speichern'); saveBtn.disabled=true;
    statusEl=el('span','status saved','Gespeichert');
    saveBtn.addEventListener('click', doSave);
    var arcBtn=el('button','btn btn-ghost','📦 Archiv-Datei herunterladen');
    arcBtn.title='Formulardaten dieser Karte für das PV-Kartenarchiv-Programm speichern';
    arcBtn.addEventListener('click', function(){ doArchiveFile(arcBtn); });
    bar.appendChild(saveBtn); bar.appendChild(arcBtn); bar.appendChild(statusEl);
    app.appendChild(bar);

    // ---- Freigabe für die Beschreibung (nur sichtbar, solange sie fehlt) ----
    descBox=el('div','syncbar'); descBox.style.marginTop='14px'; descBox.style.marginBottom='0';
    app.appendChild(descBox);
    renderDescBox();

    resize();
  }

  function buildPersField(f){
    if(f.type==='anrede') return fieldWrap(f.label, makeSelect('anrede', config.personalien.anrede));
    return fieldWrap(f.label, makeInput(f.key, f.type));
  }

  function doSave(){
    saveBtn.disabled=true;
    statusEl.textContent='Speichere…'; statusEl.className='status';
    data._updatedAt = Date.now();
    return saveCardData(t, data).then(function(){
      dirty=false;
      statusEl.textContent='Gespeichert ✓'; statusEl.className='status saved';
    }, function(){
      statusEl.textContent='Fehler beim Speichern'; statusEl.className='status dirty';
      saveBtn.disabled=false;
      throw new Error('Speichern fehlgeschlagen');
    }).then(function(){
      // Beschreibung nachziehen – ein Fehler hier blockiert das Speichern nicht
      if(!descToken) return;
      statusEl.textContent='Gespeichert ✓ · aktualisiere Beschreibung…';
      return syncDescription().then(function(changed){
        statusEl.textContent='Gespeichert ✓'+(changed ? ' · Beschreibung aktualisiert' : '');
        statusEl.className='status saved';
      }).catch(function(e){
        statusEl.textContent='Gespeichert ✓ · Beschreibung nicht aktualisiert: '+((e&&e.message)||e);
        statusEl.className='status dirty';
        if(e && e.authFailed){ descToken=null; t.remove('member','private','descToken').catch(function(){}); renderDescBox(); }
      }).then(resize);
    });
  }

  /* ================= Beschreibung automatisch füllen =================
     Beim Speichern werden alle ausgefüllten Felder in einen eigenen Bereich
     oben in der Trello-Beschreibung geschrieben. Eigener Text in der
     Beschreibung außerhalb dieses Bereichs bleibt unverändert.
     Dafür braucht jede Person einmalig eine Trello-Freigabe (lesen + schreiben);
     sie wird in Trellos privatem Mitgliederspeicher abgelegt. */
  var descToken=null, descBox=null;
  var DESC_START=/^### ▤ .*$/m, DESC_END='*— Ende Projektdaten —*';

  function mdEsc(v){
    return String(v).replace(/\r\n?/g,'\n').trim()
      .replace(/([\\`*_\[\]<>|])/g,'\\$1')
      .replace(/^(\s*)([#>+-]|\d+\.)(?=\s)/gm,'$1\\$2')
      .replace(/\n+/g,'  \n  ');           // Zeilenumbrüche innerhalb eines Listenpunkts
  }
  function filled(v){ return v!=null && String(v).trim()!==''; }
  function buildDescBlock(){
    var sections=[];
    function section(title, lines){ if(lines.length) sections.push('**'+mdEsc(title)+'**\n'+lines.join('\n')); }

    section(config.headings.personalien||'Personalien', PERSONALIEN_FIELDS.filter(function(f){ return filled(data[f.key]); })
      .map(function(f){ return '- '+mdEsc(f.label)+': '+mdEsc(data[f.key]); }));
    section(config.headings.eckdaten||'Eckdaten', ECKDATEN_FIELDS.filter(function(f){ return filled(data[f.key]); })
      .map(function(f){ return '- '+mdEsc(f.label)+': '+mdEsc(data[f.key]); }));
    var plan=config.headings.planung||'Planung';
    (config.groups||[]).forEach(function(g){
      section(plan+' – '+g.title, g.rows.filter(function(r){ return filled(data[r.key]) || filled(data[r.key+'_anzahl']); })
        .map(function(r){
          var v=data[r.key], n=data[r.key+'_anzahl'];
          if(filled(v) && filled(n)) return '- '+mdEsc(r.label)+': '+mdEsc(v)+' ('+mdEsc(r.countLabel)+': '+mdEsc(n)+')';
          if(filled(v)) return '- '+mdEsc(r.label)+': '+mdEsc(v);
          return '- '+mdEsc(r.countLabel)+': '+mdEsc(n);
        }));
    });
    section('Weitere Angaben', EXTRA_FIELDS.filter(function(f){ return filled(data[f.key]); })
      .map(function(f){ return '- '+mdEsc(String(f.label).replace(/:\s*$/,''))+': '+mdEsc(data[f.key]); }));

    if(!sections.length) return '';
    return '### ▤ '+(config.headings.projekt||'Projektdaten')+'\n'+
           '*Automatisch aus dem Formular übernommen – Änderungen bitte im Formular vornehmen.*\n\n'+
           sections.join('\n\n')+'\n\n'+DESC_END;
  }
  /* Bereich in der bestehenden Beschreibung ersetzen, einfügen oder entfernen */
  function mergeDesc(current, block){
    current=String(current||'').replace(/\r\n?/g,'\n');
    var m=current.match(DESC_START), rest=current;
    if(m){
      var endIdx=current.indexOf(DESC_END, m.index);
      if(endIdx>-1){
        var before=current.slice(0,m.index), after=current.slice(endIdx+DESC_END.length);
        if(!block) return (before.replace(/\s+$/,'')+(before.trim()&&after.trim()?'\n\n':'')+after.replace(/^\s+/,'')).trim();
        return before+block+after;
      }
    }
    if(!block) return current;
    return rest.trim() ? block+'\n\n'+rest.replace(/^\s+/,'') : block;
  }

  function trelloApi(method, path, params){
    var q='key='+encodeURIComponent(APP_KEY)+'&token='+encodeURIComponent(descToken);
    var opts={ method:method, credentials:'omit' };
    if(params){
      opts.headers={ 'Content-Type':'application/x-www-form-urlencoded' };
      opts.body=Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    }
    return fetch('https://api.trello.com/1/'+path+(path.indexOf('?')<0?'?':'&')+q, opts).then(function(r){
      if(r.status===401 || r.status===403){ var e=new Error('Freigabe ungültig – bitte neu erteilen'); e.authFailed=true; throw e; }
      if(!r.ok) throw new Error('Trello antwortet mit HTTP '+r.status);
      return r.json();
    }, function(){ throw new Error('Trello nicht erreichbar'); });
  }
  function syncDescription(){
    var cardId; try { cardId=t.getContext().card; } catch(e){}
    if(!cardId) return Promise.reject(new Error('Karten-ID unbekannt'));
    return trelloApi('GET','cards/'+cardId+'?fields=desc').then(function(c){
      var next=mergeDesc(c.desc, buildDescBlock());
      if(next.length>16384) throw new Error('Beschreibung wäre zu lang (Trello erlaubt 16.384 Zeichen)');
      if(next===String(c.desc||'').replace(/\r\n?/g,'\n')) return false;
      return trelloApi('PUT','cards/'+cardId, { desc: next }).then(function(){ return true; });
    });
  }

  function renderDescBox(statusMsg){
    if(!descBox) return;
    descBox.innerHTML='';
    descBox.style.display = descToken ? 'none' : '';
    if(descToken) return;
    descBox.appendChild(el('div','syncbar-title','Beschreibung automatisch füllen'));
    descBox.appendChild(el('div','syncbar-text','Damit die ausgefüllten Felder beim Speichern in die Kartenbeschreibung übernommen werden, einmalig die Trello-Freigabe erteilen (gilt danach für alle Karten).'));
    var row=el('div','syncbar-btns');
    var bOpen=el('button','btn btn-primary','Trello-Freigabe erteilen');
    row.appendChild(bOpen); descBox.appendChild(row);
    var msg=el('div','syncbar-text',statusMsg||''); msg.style.margin='8px 0 0'; descBox.appendChild(msg);
    bOpen.addEventListener('click', function(){
      window.open('https://trello.com/1/authorize?expiration=never&scope=read,write&response_type=token&name='+
                  encodeURIComponent('PV-Work-List')+'&key='+encodeURIComponent(APP_KEY), '_blank');
      row.innerHTML='';
      var f=el('div','field'); f.style.margin='4px 0 10px';
      f.appendChild(el('label',null,'Im neuen Tab „Zulassen“ klicken, dann den Code hier einfügen'));
      var inp=document.createElement('input'); inp.type='text'; inp.placeholder='Code aus dem Trello-Tab'; f.appendChild(inp);
      descBox.insertBefore(f, msg);
      var bSave=el('button','btn btn-primary','Code speichern'), bCancel=el('button','btn btn-ghost','Abbrechen');
      row.appendChild(bSave); row.appendChild(bCancel); descBox.insertBefore(row, msg);
      bCancel.addEventListener('click', function(){ renderDescBox(); resize(); });
      bSave.addEventListener('click', function(){
        var tok=(inp.value||'').trim();
        if(!tok){ msg.textContent='Bitte den Code einfügen.'; return; }
        bSave.disabled=true; msg.textContent='Prüfe Freigabe…';
        descToken=tok;
        syncDescription().then(function(){
          return t.set('member','private','descToken', tok);
        }).then(function(){
          renderDescBox(); statusEl.textContent='Freigabe gespeichert ✓ · Beschreibung aktualisiert'; statusEl.className='status saved'; resize();
        }).catch(function(e){
          descToken=null; bSave.disabled=false;
          msg.textContent='Fehler: '+((e&&e.message)||e); resize();
        });
      });
      resize();
    });
  }

  /* ================= Archiv-Datei =================
     Enthält alles aus diesem Formular (Werte, Überschriften, Farben,
     Feldbezeichnungen) plus die Karten-ID. Das PV-Kartenarchiv-Programm
     auf dem Rechner holt damit Beschreibung, Checklisten, Kommentare und
     Bilder bei Trello ab und erzeugt das PDF. */
  function pad2(n){ return (n<10?'0':'')+n; }
  function archiveName(card){
    var d=new Date(), stamp=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    var base=[data.kundennummer, data.nachname, card.name].filter(function(x){ return x && String(x).trim(); }).join('_') || 'Karte';
    base=base.replace(/[äÄöÖüÜß]/g, function(ch){ return {'ä':'ae','Ä':'Ae','ö':'oe','Ö':'Oe','ü':'ue','Ü':'Ue','ß':'ss'}[ch]; })
             .replace(/[^A-Za-z0-9._-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0,80);
    return base+'_'+stamp+'.pv-archiv.json';
  }
  function doArchiveFile(btn){
    btn.disabled=true;
    var before = dirty ? doSave() : Promise.resolve();
    before.then(function(){
      return Promise.all([
        t.card('id','name','url','shortLink'),
        t.board('id','name').catch(function(){ return {}; }),
        t.list('id','name').catch(function(){ return {}; })
      ]);
    }).then(function(r){
      var card=r[0]||{};
      var file={
        format:'pv-kartenarchiv', version:1,
        exportedAt:new Date().toISOString(),
        card:{ id:card.id, name:card.name||'', url:card.url||'', shortLink:card.shortLink||'' },
        board:{ id:(r[1]||{}).id||'', name:(r[1]||{}).name||'' },
        list:{ id:(r[2]||{}).id||'', name:(r[2]||{}).name||'' },
        config:config,
        fields:{ personalien:PERSONALIEN_FIELDS, eckdaten:ECKDATEN_FIELDS, extra:EXTRA_FIELDS },
        data:data
      };
      var blob=new Blob([JSON.stringify(file,null,2)], { type:'application/json' });
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=archiveName(card); a.style.display='none';
      document.body.appendChild(a);
      try { a.click(); } catch(e){ window.open(url,'_blank'); }
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
      statusEl.textContent='Archiv-Datei gespeichert ✓'; statusEl.className='status saved';
    }).catch(function(e){
      statusEl.textContent='Fehler: '+((e&&e.message)||e); statusEl.className='status dirty';
    }).then(function(){ btn.disabled=false; resize(); });
  }

  function init(){
    Promise.all([ loadConfig(t), loadCardData(t), t.get('member','private','descToken').catch(function(){ return null; }) ]).then(function(res){
      config=res[0]; data=res[1] || {}; descToken=res[2] || null;
      render();
    });
  }

  t.render(function(){ resize(); });
  init();
</script>
</body>
</html>
